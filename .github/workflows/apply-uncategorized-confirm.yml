name: Apply uncategorized save confirmation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-uncategorized-confirm.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add confirmation before uncategorized saves
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          link_before = "      if (!title || !url) {\n        toast('タイトルとURLを入力してください');\n        return;\n      }\n      const now = new Date().toISOString();"
          link_after = "      if (!title || !url) {\n        toast('タイトルとURLを入力してください');\n        return;\n      }\n      if (projectName === '未分類' && !window.confirm('分類が「未分類」のままです。このまま保存しますか？')) {\n        $('linkProject').focus();\n        return;\n      }\n      const now = new Date().toISOString();"

          prompt_before = "      if (!title && !body.trim()) {\n        toast('タイトルか本文を入力してください');\n        return;\n      }\n      const now = new Date().toISOString();"
          prompt_after = "      if (!title && !body.trim()) {\n        toast('タイトルか本文を入力してください');\n        return;\n      }\n      if (categoryName === '未分類' && !window.confirm('カテゴリが「未分類」のままです。このまま保存しますか？')) {\n        $('promptCategory').focus();\n        return;\n      }\n      const now = new Date().toISOString();"

          if text.count(link_before) != 1:
              raise SystemExit(f'Link save block match count was {text.count(link_before)}, expected 1')
          if text.count(prompt_before) != 1:
              raise SystemExit(f'Prompt save block match count was {text.count(prompt_before)}, expected 1')

          text = text.replace(link_before, link_after, 1)
          text = text.replace(prompt_before, prompt_after, 1)
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/apply-uncategorized-confirm.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html .github/workflows/apply-uncategorized-confirm.yml
          git commit -m "未分類保存前の確認を追加"
          git push
