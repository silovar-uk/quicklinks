name: Visual QA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Start local server
        run: |
          mkdir -p visual-qa
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/quicklinks-server.log 2>&1 &
          echo $! > /tmp/quicklinks-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Local server did not become ready.' >&2
          exit 1

      - name: Run metadata resolver regression QA
        run: node --experimental-default-type=module scripts/metadata-worker-regression.mjs

      - name: Run browser visual QA
        env:
          LOCAL_URL: http://127.0.0.1:4173/
          PRODUCTION_URL: https://silovar-uk.github.io/quicklinks/
          RUN_PRODUCTION_QA: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          VISUAL_QA_DIR: visual-qa
        run: node scripts/visual-qa.mjs

      - name: Run history regression QA
        env:
          LOCAL_URL: http://127.0.0.1:4173/
        run: node scripts/history-regression.mjs

      - name: Run loading regression QA
        env:
          LOCAL_URL: http://127.0.0.1:4173/
        run: node scripts/loading-regression.mjs

      - name: Run universal input regression QA
        env:
          LOCAL_URL: http://127.0.0.1:4173/
        run: node scripts/universal-input-regression.mjs

      - name: Run category organizer regression QA
        env:
          LOCAL_URL: http://127.0.0.1:4173/
        run: node scripts/category-organizer-regression.mjs

      - name: Run mobile app shell regression QA
        env:
          LOCAL_URL: http://127.0.0.1:4173/
        run: node scripts/mobile-shell-regression.mjs

      - name: Run mekuru acceptance QA
        env:
          LOCAL_URL: http://127.0.0.1:4173/
          QA_PHASES: P1,P2,P3,P4
        run: node scripts/mekuru-qa.mjs

      - name: Run yoranai acceptance QA
        env:
          LOCAL_URL: http://127.0.0.1:4173/
          QA_PHASES: P1,P2
        run: node scripts/yoranai-qa.mjs

      - name: Collect server log
        if: always()
        run: cp /tmp/quicklinks-server.log visual-qa/server.log || true

      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-${{ github.sha }}
          path: visual-qa/
          if-no-files-found: warn
          retention-days: 14
