name: Apply category emphasis

# One-time trigger merged through a pull request.
on:
  push:
    paths:
      - '.github/workflows/apply-category-emphasis.yml'

permissions:
  contents: write

jobs:
  update-category-emphasis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Highlight category fields
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css_anchor = """    .category-input-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
          }
          """

          css_block = """

          .category-emphasis {
            padding: 10px;
            border: 1px solid #f3d79a;
            border-radius: 18px;
            background: #fffaf0;
            box-shadow: 0 5px 14px rgba(146, 64, 14, .05);
          }

          .category-emphasis label {
            color: #92400e;
          }

          .category-emphasis .input,
          .category-emphasis .select {
            border-color: #e9c879;
            background: #fffefb;
          }

          .category-emphasis .input:focus,
          .category-emphasis .select:focus {
            border-color: #d97706;
            box-shadow: 0 0 0 3px rgba(217, 119, 6, .11);
          }
          """

          if '.category-emphasis {' not in text:
              if css_anchor not in text:
                  raise SystemExit('CSS anchor not found')
              text = text.replace(css_anchor, css_anchor.rstrip('\n') + css_block, 1)

          replacements = [
              (
                  '      <div class="form-row">\n        <label for="linkProject">分類</label>',
                  '      <div class="form-row category-emphasis">\n        <label for="linkProject">分類</label>',
              ),
              (
                  '      <div class="form-row">\n        <label for="promptCategory">カテゴリ</label>',
                  '      <div class="form-row category-emphasis">\n        <label for="promptCategory">カテゴリ</label>',
              ),
          ]

          for before, after in replacements:
              if after in text:
                  continue
              if before not in text:
                  raise SystemExit(f'HTML anchor not found: {before}')
              text = text.replace(before, after, 1)

          if text.count('class="form-row category-emphasis"') != 2:
              raise SystemExit('Expected exactly two emphasized category fields')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-category-emphasis.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-category-emphasis.yml
          git diff --cached --quiet || git commit -m "分類欄を淡いベージュで強調"
          git push
