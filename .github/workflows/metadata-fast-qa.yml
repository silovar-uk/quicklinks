name: Metadata Fast QA

on:
  push:
    branches:
      - main
    paths:
      - 'core.js'
      - 'ui.js'
      - 'scripts/metadata-core-unit.mjs'
      - '.github/workflows/metadata-fast-qa.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'core.js'
      - 'ui.js'
      - 'scripts/metadata-core-unit.mjs'
      - '.github/workflows/metadata-fast-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check script syntax
        run: |
          node --check core.js
          node --check ui.js
          node --check scripts/metadata-core-unit.mjs
      - name: Run metadata unit checks
        run: node scripts/metadata-core-unit.mjs
