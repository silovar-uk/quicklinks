name: Deploy Quick Links Sync Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-sync-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Cloudflare credentials not configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Worker deploy skipped because Cloudflare repository secrets are not configured. GitHub Pages continues to use the browser/Microlink fallback."

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          preCommands: |
            wrangler r2 bucket create quicklinks-sync || true
            if [ -n "$YOUTUBE_API_KEY" ]; then printf '%s' "$YOUTUBE_API_KEY" | wrangler secret put YOUTUBE_API_KEY; fi
          command: deploy


      - name: Smoke test metadata resolver
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          target = "https://studio.persol-group.co.jp/rirekisyo/250107-1"
          endpoint = "https://quicklinks-sync.silovar-uk.workers.dev/v1/metadata?url=" + urllib.parse.quote(target, safe="")
          req = urllib.request.Request(endpoint, headers={"Origin": "https://silovar-uk.github.io", "Accept": "application/json"})
          with urllib.request.urlopen(req, timeout=15) as res:
              payload = json.load(res)
          data = payload.get("data") or {}
          if payload.get("status") != "success" or not data.get("title") or not data.get("description"):
              raise SystemExit("metadata smoke test failed: " + json.dumps(payload, ensure_ascii=False))
          print("metadata smoke test ok:", data["title"][:80], "/", data.get("descriptionSource"))
          PY
