<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b91c1c" />
  <title>Quick Links Mobile</title>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      color: #64748b;
      background: #f6f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div id="loader">Quick Linksを読み込んでいます…</div>
  <script>
    (async () => {
      const loader = document.getElementById('loader');
      try {
        const response = await fetch('./app.html?v=20260726-category-emphasis', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        let html = await response.text();
        const categoryCss = `

    /* 内容確認時に分類へ自然に視線を誘導 */
    #linkModal .form-row:has(> label[for="linkProject"]),
    #promptModal .form-row:has(> label[for="promptCategory"]) {
      padding: 10px;
      border: 1px solid #f3d79a;
      border-radius: 18px;
      background: #fffaf0;
      box-shadow: 0 5px 14px rgba(146, 64, 14, .05);
    }

    label[for="linkProject"],
    label[for="promptCategory"] {
      color: #92400e;
    }

    #linkProject,
    #linkProjectSelect,
    #promptCategory,
    #promptCategorySelect {
      border-color: #e9c879;
      background: #fffefb;
    }

    #linkProject:focus,
    #linkProjectSelect:focus,
    #promptCategory:focus,
    #promptCategorySelect:focus {
      border-color: #d97706;
      box-shadow: 0 0 0 3px rgba(217, 119, 6, .11);
    }
`;

        if (!html.includes('</style>')) throw new Error('style closing tag not found');
        html = html.replace('</style>', `${categoryCss}  </style>`);
        html = html.replace('このHTMLは1ファイルで動きます。', 'このページはブラウザ内で動きます。');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        loader.textContent = '読み込みに失敗しました。ページを再読み込みしてください。';
      }
    })();
  </script>
</body>
</html>
