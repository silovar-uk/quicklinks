<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b4232c" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="180x180" href="/quicklinks/apple-touch-icon.png?v=20260814">
  <link rel="apple-touch-icon" sizes="180x180" href="/quicklinks/apple-touch-icon.png?v=20260814" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Quick Links</title>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      color: #64748b;
      background: #f7f7f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div id="loader">Quick Linksを読み込んでいます…</div>
  <script>
    (async () => {
      const loader = document.getElementById('loader');
      try {
        const response = await fetch('./app.html?v=20260823-quiet', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        let html = await response.text();
        const quickUrlModal = `
  <div class="modal" id="quickUrlModal" aria-hidden="true">
    <div class="modal-sheet">
      <div class="modal-head">
        <h2 class="modal-title">リンクを追加</h2>
        <button class="modal-close" data-close-modal="quickUrlModal">×</button>
      </div>
      <div class="hint" style="margin-bottom:12px;">URLを貼るだけでページ情報を取得し、保存前に内容を確認できます。</div>
      <div class="form-row">
        <label for="quickUrlInput">URL</label>
        <div class="quick-url-actions">
          <input id="quickUrlInput" class="input" inputmode="url" autocomplete="url" placeholder="https://..." />
          <button class="btn ghost compact" id="pasteQuickUrlBtn" type="button">貼る</button>
        </div>
        <div class="duplicate-warning" id="quickUrlDuplicate"></div>
      </div>
      <div class="form-row">
        <label for="quickUrlProject">分類 <span style="color:#94a3b8;font-weight:700;">（あとから変更可）</span></label>
        <div class="category-input-grid">
          <input id="quickUrlProject" class="input" list="quickUrlProjectList" placeholder="未分類（必要なら新しい分類名を入力）" />
          <select id="quickUrlProjectSelect" class="select" aria-label="既存分類から選ぶ"><option value="">既存分類から選ぶ</option></select>
        </div>
        <datalist id="quickUrlProjectList"></datalist>
      </div>
      <div class="fetch-status" id="quickUrlStatus">URLを貼るとページ情報を取得し、保存前に内容を確認できます。</div>
      <div class="quick-url-privacy">ページ情報を取得できない場合は、取得のため外部サービスを使用します。AIによる分類・文章生成は行いません。</div>
      <div class="modal-actions">
        <button class="btn ghost" id="manualQuickUrlBtn" type="button">情報取得せず入力</button>
        <button class="btn primary" id="fetchQuickUrlBtn" type="button">URLから追加</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin:15px 0 9px;color:#94949c;font-size:10px;font-weight:720;"><span style="height:1px;background:var(--line);flex:1;"></span><span>まとめて追加</span><span style="height:1px;background:var(--line);flex:1;"></span></div>
      <button class="btn ghost" id="openJsonImportBtn" type="button" aria-expanded="false" style="width:100%;min-height:44px;">JSONからまとめて追加</button>
    </div>
  </div>`;

        const metadataPreview = `<div class="metadata-preview" id="linkMetadataPreview" hidden></div>`;

        if (!html.includes('</head>') || !html.includes('</body>')) throw new Error('app shell is incomplete');
        html = html.replace('<title>Quick Links Mobile</title>', '<title>Quick Links</title>');
        html = html.replace('<h1 class="brand-title">Quick Links Mobile</h1>', '<h1 class="brand-title">Quick Links</h1>');
        html = html.replace('</head>', `  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />\n  <link rel="apple-touch-icon" sizes="180x180" href="/quicklinks/apple-touch-icon.png?v=20260814" />\n  <link rel="manifest" href="./manifest.webmanifest" />\n  <link rel="stylesheet" href="./quick-add.css?v=20260811-precision" />\n  <link rel="stylesheet" href="./layered-minimal.css?v=20260823-quiet" />\n  <link rel="stylesheet" href="./precision-upgrade.css?v=20260823-hierarchy" />\n</head>`);
        html = html.replace('  <div class="modal" id="yamlAddModal"', `${quickUrlModal}\n  <div class="modal" id="yamlAddModal"`);
        html = html.replace('      <div class="form-row">\n        <label for="linkNote">備考</label>', `      ${metadataPreview}\n      <div class="form-row">\n        <label for="linkNote">備考</label>`);
        html = html.replace('このHTMLは1ファイルで動きます。', 'このページはブラウザ内で動きます。');
        const scripts = [
          '  <scr' + 'ipt src="./quick-add.js?v=20260811-precision"></scr' + 'ipt>',
          '  <scr' + 'ipt src="./precision-data.js?v=20260811-precision"></scr' + 'ipt>',
          '  <scr' + 'ipt src="./precision-ui.js?v=20260813-iconsystem"></scr' + 'ipt>',
          '  <scr' + 'ipt src="./precision-a11y.js?v=20260811-precision"></scr' + 'ipt>'
        ].join('\n') + '\n';
        html = html.replace('</body>', scripts + '</body>');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        loader.textContent = '読み込みに失敗しました。ページを再読み込みしてください。';
      }
    })();
  </script>
</body>
</html>
